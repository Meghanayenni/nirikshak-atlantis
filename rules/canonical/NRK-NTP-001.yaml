rule_id: NRK-NTP-001
title: At least one time source configured
severity: low
rationale: >-
  Every log line, certificate check and correlation across devices depends on the
  clock. A device with no configured time source will drift, and drifted
  timestamps make an incident timeline unreconstructable across a fleet even when
  every individual log is intact. Low severity in isolation; its cost is paid
  later, by the investigation.
check:
  field: ntp_servers
  condition: { op: non_empty }
frameworks:
  - framework: nist
    control_id: "SC-45(01)"
    version: "5.2.0"
    citation: "NIST SP 800-53 Rev 5 — OSCAL catalog, edition 5.2.0, control SC-45(01)"
    # Our judgement that this check evidences this control, not a
    # published crosswalk. No catalog maps NIRIKSHAK's own rules.
    mapping_provenance: project_asserted
    coverage: partial
    coverage_reason: >-
      A configured NTP server is a time source. Whether it is authoritative, and the
      synchronisation threshold, are organisation-defined and not tested.
  - framework: cis
    control_id: "2.3.2"
    version: "v2.2.1 (2025-07-17)"
    citation: "CIS Cisco IOS XE 17.x Benchmark, edition v2.2.1 (2025-07-17), control 2.3.2"
    # The recommendation's remediation sets the floor at one server, which is
    # this rule's condition; it prefers more, and so would we (ADR 0052).
    mapping_provenance: project_asserted
    coverage: full
    coverage_reason: >-
      The recommendation's remediation floor is one NTP server (ADR 0052), which is
      what this rule tests.
not_mapped:
  - framework: stig
    reason: >-
      CISC-ND-001030 requires redundant time sources and shows two; this rule
      passes one. Mapping it would show a STIG identifier beside a PASS the STIG calls a
      finding (ADR 0052).
